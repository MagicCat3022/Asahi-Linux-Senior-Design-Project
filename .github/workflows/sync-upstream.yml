name: Sync upstream kernel branches

on:
  push:
    branches: [project]
    paths: [.github/workflows/sync-upstream.yml]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync ${{ matrix.branch }}
    if: github.repository == 'MagicCat3022/Asahi-Linux-Senior-Design-Project' && github.ref == 'refs/heads/project'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        branch: [main, fairydust, asahi]
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REPO: ${{ github.repository }}
      UPSTREAM_REPO: AsahiLinux/linux
      SYNC_BRANCH: ${{ matrix.branch }}
    steps:
      - name: Mirror branch to upstream
        shell: bash
        run: |
          set -euo pipefail

          case "$SYNC_BRANCH" in
            main|fairydust|asahi) ;;
            *) echo "::error::Refusing to mirror unexpected branch: $SYNC_BRANCH"; exit 1 ;;
          esac

          upstream_sha=$(gh api "repos/$UPSTREAM_REPO/git/ref/heads/$SYNC_BRANCH" --jq '.object.sha')
          previous_sha=$(gh api "repos/$TARGET_REPO/git/ref/heads/$SYNC_BRANCH" --jq '.object.sha')
          repository_id=$(gh api "repos/$TARGET_REPO" --jq '.node_id')

          # These branches are disposable mirrors, including rewritten history.
          # beforeOid acts as a lease: fail if the target changed since our read.
          # Also update an unchanged ref to verify write access on every run.
          if ! gh api graphql \
            -f query='mutation($repository: ID!, $ref: GitRefname!, $before: GitObjectID!, $after: GitObjectID!) {
              updateRefs(input: {repositoryId: $repository, refUpdates: [{
                name: $ref, beforeOid: $before, afterOid: $after, force: true
              }]}) { clientMutationId }
            }' \
            -f "repository=$repository_id" -f "ref=refs/heads/$SYNC_BRANCH" \
            -f "before=$previous_sha" -f "after=$upstream_sha"; then
            echo "::error::Cannot mirror $SYNC_BRANCH. Check the API error above for a concurrent update, branch protection, or permissions."
            exit 1
          fi

          updated_sha=$(gh api "repos/$TARGET_REPO/git/ref/heads/$SYNC_BRANCH" --jq '.object.sha')
          if [[ "$updated_sha" != "$upstream_sha" ]]; then
            echo "::error::GitHub returned an unexpected commit for $SYNC_BRANCH."
            exit 1
          fi

          if [[ "$previous_sha" == "$upstream_sha" ]]; then
            result='Already up to date'
          else
            result='Mirrored (forced updates allowed)'
          fi

          {
            printf '### %s\n\n' "$SYNC_BRANCH"
            printf '%s with `%s` at the time of this run.\n\n' "$result" "$UPSTREAM_REPO"
            printf -- '- Previous commit: `%s`\n' "$previous_sha"
            printf -- '- Upstream commit: `%s`\n' "$upstream_sha"
          } >> "$GITHUB_STEP_SUMMARY"
